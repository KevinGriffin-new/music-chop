# Build, sign, notarize, staple, and publish the macOS .dmg when a version tag
# is pushed. This is the automation behind "tag a release → get a notarized
# build" — it reuses packaging/build_macos.sh unchanged, just with the signing
# creds sourced from repo secrets instead of your local keychain.
#
# Cut a release:
#   git tag v0.1.1 && git push origin v0.1.1
# (origin pushes to both sourcehut and GitHub; the tag on GitHub fires this.)
#
# ── ONE-TIME SETUP ── add these under GitHub ▸ Settings ▸ Secrets and variables
# ▸ Actions ▸ "New repository secret". Until they exist the job fails fast at the
# import/notarize step (it never silently ships an unsigned build).
#
#   MACOS_CERT_P12        base64 of your exported "Developer ID Application"
#                         certificate (.p12, private key included). In Keychain
#                         Access: right-click the cert ▸ Export ▸ .p12 with a
#                         password, then:   base64 -i cert.p12 | pbcopy
#   MACOS_CERT_PASSWORD   the password you set on that .p12 export
#   APPLE_ID              your Apple Developer account email
#   APPLE_APP_PASSWORD    an app-specific password (appleid.apple.com ▸ Sign-In
#                         & Security ▸ App-Specific Passwords) — the same kind of
#                         credential behind your local `dv2mv-notary` profile
#   APPLE_TEAM_ID         U57D9AH736
#
# Notes:
#   • Runs on an arm64 runner → the .dmg is Apple-silicon only (matches the
#     local build; the freeze doesn't do universal2 yet).
#   • workflow_dispatch builds without publishing — handy to smoke-test the
#     pipeline before tagging.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # manual run from the Actions tab (build only, no release)

permissions:
  contents: write           # create the GitHub Release and upload the .dmg

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Build env: a Python 3.13 venv whose tkinter links Tcl/Tk 9.0. The .app
      # bundles whatever Tcl/Tk the build interpreter links, and Tk 9's modern
      # macOS file panels replace the Tk 8.6 ones that crashed (NSSavePanel
      # badPop). Standard/conda CPython link Tk 8.6; Homebrew's python-tk@3.13
      # builds _tkinter against Homebrew tcl-tk 9. build_macos.sh auto-detects
      # ~/dv2mv-tk9-venv. (No actions/setup-python — we use the brew interpreter.)
      - name: System deps + Tk-9 Python (ffmpeg/rubberband are bundled into the app)
        run: |
          brew install python@3.13 python-tk@3.13 tcl-tk ffmpeg rubberband \
            || brew install python@3.13 python-tk@3.13 tcl-tk ffmpeg

      - name: Create the Tk-9 build venv (runtime stack + build tools)
        run: |
          set -euo pipefail
          /opt/homebrew/opt/python@3.13/bin/python3.13 -m venv "$HOME/dv2mv-tk9-venv"
          "$HOME/dv2mv-tk9-venv/bin/python" -m pip install --upgrade pip
          "$HOME/dv2mv-tk9-venv/bin/pip" install -r requirements.txt -r packaging/requirements-build.txt
          # fail fast if tkinter isn't actually Tk 9 — never ship the crashy 8.6 panels
          TK="$("$HOME/dv2mv-tk9-venv/bin/python" -c 'import tkinter;print(tkinter.TkVersion)')"
          echo "build venv → Python $("$HOME/dv2mv-tk9-venv/bin/python" -c 'import sys;print(sys.version.split()[0])') · Tk $TK"
          case "$TK" in 9.*) ;; *) echo "::error::build venv links Tk $TK, not Tk 9"; exit 1;; esac

      - name: Import Developer ID certificate into a throwaway keychain
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$CERT_P12" ] || { echo "::error::MACOS_CERT_P12 secret is not set"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KP="$(uuidgen)"                       # ephemeral keychain password
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # let codesign use the key non-interactively
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KEYCHAIN"
          # put our keychain first in the search list so find-identity/codesign see it
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/["[:space:]]//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Create notary profile from secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [ -n "$APPLE_ID" ] || { echo "::error::APPLE_ID secret is not set"; exit 1; }
          xcrun notarytool store-credentials dv2mv-notary \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

      - name: Build, sign, notarize, staple
        run: |
          set -euo pipefail
          DEVELOPER_ID="$(security find-identity -v -p codesigning \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          [ -n "$DEVELOPER_ID" ] || { echo "::error::no Developer ID Application identity after import"; exit 1; }
          echo "Signing as: $DEVELOPER_ID"
          VERSION=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          DEVELOPER_ID="$DEVELOPER_ID" NOTARY_PROFILE=dv2mv-notary \
            DV2MV_VERSION="$VERSION" \
            bash packaging/build_macos.sh

      # Release smoke: launch the FROZEN app as the bootloader does it, run
      # preflight() inside it, and assert every required tool resolves out of
      # the bundled bin/. Guards the bundle-precedence fix end-to-end on the
      # actual runner output — a misbuilt bundle (missing binary, wrong bin
      # location, broken PATH prepend) stops the release here, never ships.
      - name: Preflight smoke (bundled-binary precedence)
        run: |
          set -euo pipefail
          APP="dist/dv2mv.app"
          [[ -d "$APP" ]] || { echo "::error::no $APP to smoke"; exit 1; }
          # Run the frozen binary directly with --preflight-smoke. PyInstaller's
          # bootloader extracts to _MEIPASS, entry._prepare_environment() prepends
          # <_MEIPASS>/bin to PATH, and engine.preflight() must report every
          # required tool found with bundled=True. workflow_dispatch builds may be
          # ad-hoc-signed (no secrets), so a quarantine env is harmless -- we
          # don't gatekeep via Gatekeeper, just invoke the binary.
          OUT="$("$APP/Contents/MacOS/dv2mv" --preflight-smoke 2>&1)" || {
            echo "::error::preflight smoke failed — a required tool is missing from the bundle:"
            echo "$OUT"
            exit 1
          }
          echo "$OUT"
          # belt + braces: assert each required tool is flagged bundled.
          # (The entry.py --preflight-smoke path already exited nonzero if a
          # required tool was missing; this cheaply proves bundled=True on top.)
          "$HOME/dv2mv-tk9-venv/bin/python" - "$OUT" <<'PY'
          import json, sys
          p = json.loads(sys.argv[1])
          for name in ("ffmpeg", "ffprobe"):
              t = next((x for x in p["tools"] if x["name"] == name), None)
              assert t and t["found"] and t["bundled"], f"{name} not bundled/found: {t}"
              print(f"  ✓ {name} bundled → {t['path']}")
          PY

      - name: Upload .dmg as a workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: dv2mv-dmg
          path: dist/dv2mv-*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/dv2mv-*.dmg \
            --title "${GITHUB_REF_NAME}" --generate-notes
